# Music HLS streaming — include in YOUR_DOMAIN server block
# Or add individual blocks to the existing nginx config.
#
# IMPORTANT: All HLS routes need `auth_request off;` because Safari/Brave's
# <audio src=""> element does not send SSO session cookies, causing
# a redirect to the auth page instead of serving the media.

# HLS master playlists (no cache — content may change)
location ~ ^/api/tracks/(\d+)/stream\.m3u8$ {
    auth_request off;
    proxy_pass http://127.0.0.1:8150;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "https://your-domain.com" always;
    add_header Cache-Control "no-cache" always;
}

# HLS variant playlists (e.g. /api/tracks/5/stream/128k.m3u8)
location ~ ^/api/tracks/(\d+)/stream/.*\.m3u8$ {
    auth_request off;
    proxy_pass http://127.0.0.1:8150;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "https://your-domain.com" always;
    add_header Cache-Control "no-cache" always;
}

# HLS segments — MPEG-TS containers (immutable, aggressive cache)
# Note: FFmpeg -f hls produces MPEG-TS even with .aac extension
location ~ ^/api/tracks/(\d+)/stream/.*\.aac$ {
    auth_request off;
    proxy_pass http://127.0.0.1:8150;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "https://your-domain.com" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Album artwork
location ~ ^/api/tracks/(\d+)/artwork$ {
    auth_request off;
    proxy_pass http://127.0.0.1:8150;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400" always;
}

# PWA manifest (bypass auth for service worker)
location = /manifest.json {
    auth_request off;
    proxy_pass http://127.0.0.1:8151;
    proxy_set_header Host $host;
}

# Increase upload size for music files
client_max_body_size 500m;

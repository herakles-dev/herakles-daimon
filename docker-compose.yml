services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8151}:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8150/ws/gemini}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - play

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8150}:8000"
    env_file:
      - .env
    environment:
      - MUSIC_STORAGE_PATH=/music
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-200}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}
    volumes:
      - play_music:/music
      # Mount your YouTube OAuth tokens if using the broadcast feature:
      # - /path/to/your/youtube_tokens.json:/secrets/youtube_tokens.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - play

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daimon_play}
      POSTGRES_USER: ${POSTGRES_USER:-play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - play_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-play} -d ${POSTGRES_DB:-daimon_play}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - play

volumes:
  play_pgdata:
  play_music:

networks:
  play:
    driver: bridge
